# Reusable job workflow for archestra-runtime-review.yml. Copy it to
# .github/workflows/archestra-runtime-review-run.yml in the same repository.
#
# The calling job passes only the secrets that this job needs: the actor's
# Archestra token and, for fixes, the GitHub App key. This job never gets
# the rest of the repository's secrets. Its GITHUB_TOKEN permissions come
# from the calling job, so a review gets no "actions" permission.
name: Archestra Runtime Review Run

on:
  workflow_call:
    inputs:
      kind:
        description: '"review" or "fix".'
        type: string
        required: true
      gateway-url:
        description: The Archestra MCP gateway endpoint.
        type: string
        required: true
      agents:
        description: Agent IDs, one for each line.
        type: string
        required: true
      timeout-minutes:
        description: The time limit for the job.
        type: number
        default: 90
    secrets:
      ARCHESTRA_TOKEN:
        description: The actor's Archestra platform token. Empty skips the event with a warning.
        required: false
      APP_ID:
        description: The GitHub App that pushes fixes. Fix jobs only.
        required: false
      APP_PRIVATE_KEY:
        description: The private key of that GitHub App. Fix jobs only.
        required: false

# The caller's job carries the concurrency group. This group only stops two
# copies of the same event from running at once.
concurrency:
  group: archestra-review-run-${{ github.workflow }}-${{ github.ref }}-${{ inputs.kind }}-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    name: Archestra ${{ inputs.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # The job token posts the review and, for fixes, reads the failing checks.
    # A called job cannot ask for more than its caller grants, so the review
    # caller grants contents: read and pull-requests: write, and the fix
    # caller also grants actions: read.
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # No token for this actor: skip the review, do not fail the job. The
      # person creates a platform token and stores it as their secret.
      - name: Check the actor's Archestra token
        id: token
        env:
          ARCHESTRA_TOKEN: ${{ secrets.ARCHESTRA_TOKEN }}
          GATEWAY_URL: ${{ inputs.gateway-url }}
        shell: bash
        run: |
          if [[ -z "$ARCHESTRA_TOKEN" ]]; then
            echo "::notice::No Archestra token for this actor. Store their platform token as ARCHESTRA_TOKEN_<LOGIN> to get reviews."
          elif [[ -z "$GATEWAY_URL" ]]; then
            echo "::notice::The ARCHESTRA_REVIEW_GATEWAY_URL variable is not set, so no review runs."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint the clone token
        if: steps.token.outputs.available == 'true' && inputs.kind == 'review'
        id: clone-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
      - name: Mint the push token
        if: steps.token.outputs.available == 'true' && inputs.kind == 'fix'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - if: steps.token.outputs.available == 'true'
        uses: archestra-ai/code-review-action@v1 # Pin to the commit of a release tag, for example @<sha> # v0.2.0.
        with:
          archestra-gateway-url: ${{ inputs.gateway-url }}
          archestra-token: ${{ secrets.ARCHESTRA_TOKEN }}
          agents: ${{ inputs.agents }}
          strategy: rotate
          retries: 1
          timeout-minutes: 30
          fail-on: never
          # Private repository: the runtime clones with this token. Mint one
          # that can only read contents (the step above with
          # permission-contents: read), or store a fine-grained token; the
          # job token also carries pull-requests: write. Remove the line for
          # a public repository.
          clone-token: ${{ steps.clone-token.outputs.token }}
          fix-token: ${{ steps.app-token.outputs.token }}
          fix-timeout-minutes: 45
          ci-rerun: false
