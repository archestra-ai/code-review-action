# Adoption workflow for archestra-ai/archestra.
# Copy to .github/workflows/archestra-runtime-review.yml beside
# claude-coreteam-review.yml, and copy archestra-runtime-review-run.yml beside
# it. Same triggers and filters as the Claude review (opened, synchronize,
# ready_for_review, reopened; same repository; not a draft; no "[WIP]"), plus
# comment events for the fix commands.
#
# Each run acts as the person who caused the event, with that person's
# Archestra platform token: their credentials, their Claude account, their
# costs. The "actor" job finds the name of that person's token secret. The
# review and fix jobs call the reusable job workflow and pass it only that
# one token, so no job gets the whole secrets context.
#
# Secrets: ARCHESTRA_TOKEN_<LOGIN> for each person (organization secrets, for
# example ARCHESTRA_TOKEN_OCTO_CAT for octo-cat), ARCHESTRA_REVIEW_APP_ID and
# ARCHESTRA_REVIEW_APP_PRIVATE_KEY (GitHub App with contents: write,
# pull-requests: write, actions: read).
# Variables: ARCHESTRA_REVIEW_GATEWAY_URL (the MCP gateway endpoint, for
# example https://archestra.example.com/v1/mcp/code-review),
# ARCHESTRA_REVIEW_AGENTS (agent IDs, one per line).
name: Archestra Runtime Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  actor:
    name: Resolve the actor
    if: >-
      github.repository == 'archestra-ai/archestra' &&
      (
        github.event_name == 'pull_request' ||
        (github.event.sender.type != 'Bot' && contains(github.event.comment.body, '/archestra'))
      )
    uses: archestra-ai/code-review-action/.github/workflows/resolve-actor-token.yml@v1 # Pin to the commit of a release tag, for example @<sha> # v0.2.2.

  review:
    name: Archestra Review
    needs: actor
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.title, '[WIP]')
    permissions:
      contents: read
      pull-requests: write # Post the review comment and inline comments.
    concurrency:
      group: archestra-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: $/.github/workflows/archestra-runtime-review-run.yml
    with:
      kind: review
      gateway-url: ${{ vars.ARCHESTRA_REVIEW_GATEWAY_URL }}
      agents: ${{ vars.ARCHESTRA_REVIEW_AGENTS }}
      timeout-minutes: 90
    # GitHub resolves this lookup before it starts the called job; only the
    # matching token is passed, not the caller's complete secrets context.
    secrets:
      ARCHESTRA_TOKEN: ${{ secrets[needs.actor.outputs.secret_name] }} # zizmor: ignore[overprovisioned-secrets,obfuscation]

  fix:
    name: Archestra Fix
    needs: actor
    # Cheap event filters only; the action checks the sender's write access
    # and ignores bots.
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          contains(github.event.comment.body, '/archestra')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/archestra'))
      )
    permissions:
      contents: read
      pull-requests: write # Update the review comment and reply.
      actions: read # Read failing jobs, logs and annotations for the CI triage.
    concurrency:
      group: archestra-fix-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    uses: $/.github/workflows/archestra-runtime-review-run.yml
    with:
      kind: fix
      gateway-url: ${{ vars.ARCHESTRA_REVIEW_GATEWAY_URL }}
      agents: ${{ vars.ARCHESTRA_REVIEW_AGENTS }}
      timeout-minutes: 120
    secrets:
      ARCHESTRA_TOKEN: ${{ secrets[needs.actor.outputs.secret_name] }} # zizmor: ignore[overprovisioned-secrets,obfuscation]
      APP_ID: ${{ secrets.ARCHESTRA_REVIEW_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ARCHESTRA_REVIEW_APP_PRIVATE_KEY }}
