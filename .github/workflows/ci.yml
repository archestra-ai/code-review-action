name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint and type check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Schemas are up to date
        run: npm run check:schemas
      - name: dist is up to date
        run: npm run check:dist
      - name: The bundle starts and rejects missing inputs
        run: |
          set +e
          output=$(node dist/index.js 2>&1)
          status=$?
          echo "$output"
          test "$status" -ne 0 && echo "$output" | grep -q 'Input "archestra-gateway-url" is required'
