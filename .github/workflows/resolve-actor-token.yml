name: Resolve the actor's Archestra token

# Reusable workflow that maps github.actor to their Archestra secret name (<PREFIX><LOGIN>).
# Example: octo-cat -> ARCHESTRA_TOKEN_OCTO_CAT. Bots return an empty secret name.

on:
  workflow_call:
    inputs:
      prefix:
        description: The secret name prefix.
        type: string
        default: ARCHESTRA_TOKEN_
    outputs:
      secret_name:
        description: The name of the actor's token secret, or "" when there is none.
        value: ${{ jobs.resolve.outputs.secret_name }}
      login:
        description: The GitHub login of the actor.
        value: ${{ jobs.resolve.outputs.login }}

permissions: {}

# One resolution per event: a second event on the same ref replaces it.
concurrency:
  group: archestra-actor-${{ github.workflow }}-${{ github.ref }}-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve the actor
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      secret_name: ${{ steps.name.outputs.secret_name }}
      login: ${{ steps.name.outputs.login }}
    steps:
      - id: name
        env:
          LOGIN: ${{ github.actor }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          if ! [[ "$PREFIX" =~ ^[A-Z_][A-Z0-9_]*$ ]]; then
            echo "::error::The prefix must be upper-case letters, digits and underscores, and must not start with a digit."
            exit 1
          fi
          echo "login=$LOGIN" >> "$GITHUB_OUTPUT"
          if [[ "$LOGIN" == *"[bot]" ]] || ! [[ "$LOGIN" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then
            echo "No token secret for the actor $LOGIN."
            echo "secret_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="${PREFIX}$(tr 'a-z-' 'A-Z_' <<<"$LOGIN")"
          echo "The actor $LOGIN uses the secret $name."
          echo "secret_name=$name" >> "$GITHUB_OUTPUT"
