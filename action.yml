name: Archestra code review
description: Review pull requests using Archestra Agent Runtimes, with interactive fixes and CI triage.
author: Archestra
branding:
  icon: check-circle
  color: blue

inputs:
  archestra-gateway-url:
    description: Archestra MCP gateway endpoint (e.g. https://archestra.example.com/v1/mcp/code-review).
    required: true
  archestra-token:
    description: Archestra platform token of the actor. If empty, the action skips execution unless fallback-token is set.
    default: ""
  fallback-token:
    description: Shared platform token used when the actor has no personal token.
    default: ""
  agents:
    description: Archestra agent IDs, one per line. Each agent must have a dedicated runtime.
    required: true
  fallback-agents:
    description: Agent IDs to use with fallback-token. Defaults to agents.
    default: ""
  strategy:
    description: Agent selection strategy ("rotate", "ordered", or "random").
    default: rotate
  retries:
    description: Number of retries on the same agent after a temporary failure (0 to 5).
    default: "1"
  max-fallbacks:
    description: Number of alternative agents to try after a permanent failure. Defaults to all remaining agents.
    default: ""
  timeout-minutes:
    description: Timeout for a single review attempt, in minutes.
    default: "30"
  overall-timeout-minutes:
    description: Total timeout across all attempts, in minutes.
    default: "120"
  instructions:
    description: Additional review instructions passed to the agent.
    default: ""
  instructions-file:
    description: Path to a workspace file containing review instructions.
    default: ""
  github-token:
    description: GitHub token for posting review comments. Requires pull-requests write.
    default: ${{ github.token }}
  post:
    description: Where to post review output ("review", "comment", or "none").
    default: review
  fail-on:
    description: Step failure condition ("never", "findings", or "error").
    default: never
  mode:
    description: Execution mode ("auto", "review", "fix", "fix-ci", or "fix-ci-main").
    default: auto
  pr-number:
    description: Pull request number for workflow_dispatch events.
    default: ""
  fix-command:
    description: Comment command prefix.
    default: /archestra
  fix-commands:
    description: Set to false to hide command instructions when fix workflows are not configured.
    default: "true"
  fix-token:
    description: GitHub App installation token for pushing fixes.
    default: ""
  clone-token:
    description: Read-only GitHub token for cloning private repositories.
    default: ""
  fix-timeout-minutes:
    description: Timeout for a single fix or CI triage attempt, in minutes.
    default: "45"
  ci-rerun:
    description: Set to true to re-run failed jobs classified as flaky. Requires actions write.
    default: "false"
  max-auto-fix-rounds:
    description: Maximum automatic fix rounds without human approval. Currently supports 0 only.
    default: "0"
  incremental-review:
    description: Set to false to start a fresh run for each review instead of continuing the previous workspace.
    default: "true"

outputs:
  status:
    description: Execution status (success, skipped, nothing-to-do, unauthorized, unavailable, aborted, or error).
  mode:
    description: Mode executed.
  agent-id:
    description: Agent ID that completed the run.
  run-id:
    description: Archestra task/run ID.
  run-url:
    description: URL to the Archestra run dashboard.
  findings-count:
    description: Number of review findings.
  attempts:
    description: JSON array of attempt history (agent, run, result, reason, duration).
  pushed-commits:
    description: JSON array of commit SHAs pushed by fix mode.
  applied:
    description: JSON array of applied findings [{finding, commit}].
  skipped:
    description: JSON array of skipped findings [{finding, reason}].
  triage:
    description: JSON object containing CI triage results.

runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
